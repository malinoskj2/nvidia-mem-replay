[package]
name = "nvidia-mem-replay"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
clap = { version = "4.5", features = ["derive"] }
tray-icon = { version = "0.26", default-features = false }
winreg = "0.56"
winsafe = { version = "0.0.29", default-features = false, features = ["dwm", "gdi", "gui", "user"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[lints.rust]
# Allowed only in src/sys/shadowplay.rs (the binding to NVIDIA's ShadowPlay API library) and
# for two one-line winsafe calls that the crate marks unsafe: a virtual-key constant in
# src/sys/hotkey.rs and EM_SCROLLCARET for the Logs view in src/gui/logs.rs.
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Prefer direct assignment when reusing an allocation would obscure the intent.
assigning_clones = "allow"
redundant_pub_crate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
